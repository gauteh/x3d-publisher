# NorKyst-800 v3, read directly from the model's output files (a shared file system) instead of THREDDS.
# Same store as `norkyst800` (same name, layout and variables). Per model run the files are the re-analysis
# (..._AN.nc, the previous days) and the forecast in pieces (..._FC_0001.nc ...), joined along time as THREDDS does;
# the newest `files_runs` runs are used and where they overlap the newest wins.
# No credentials or bucket names belong here: where to publish is a deployment matter.
name = "norkyst800"
files = "/lustre/metproductionB/products/norkyst_v3/m00/norkyst800_his_zdepth_*_m00_*.nc"
files_runs = 3  # covers back_hours = 48 with one run a day
# window: from this many hours before the newest model run to the end of the forecast
back_hours = 48

# source names; the grid is polar stereographic (X/Y in metres) with 2-D lat/lon
y_dim = "Y"
x_dim = "X"
lat = "lat"
lon = "lon"
reference_time = "forecast_reference_time"

# the surface layer
select = { depth = 0.0 }

drop_attrs = ["title_no"]

vars = ["u_eastward", "v_northward", "temperature", "Uwind_eastward", "Vwind_northward"]
ov_vars = ["u_eastward", "v_northward", "temperature", "Uwind_eastward", "Vwind_northward"]

[layout]
zstd_level = 5
map_chunk = 256            # inner chunk edge of map.zarr
map_shard = [1, 1280, 2816] # (time, y, x): the whole grid for one time step
ts_chunk = 16              # inner chunk edge of ts.zarr (all time steps)
ts_shard = 128
ov_factor = 8              # overview = block means at 1/ov_factor resolution (wind streamlines need no more)
ov_tchunk = 6             # short time chunks: a first frame does not need a whole day
mesh_stride = 8            # decimation of grid.bin (viewer geometry)

# int16 packing: precision = scale_factor (about 2x smaller than float32 before compression)
[scales]
u_eastward = 0.001         # m/s
v_northward = 0.001
temperature = 0.001        # degC
Uwind_eastward = 0.01      # m/s
Vwind_northward = 0.01

# the overview is a quick look: coarser packing than the full-resolution layouts (map.zarr, ts.zarr keep `scales`)
[ov_scales]
u_eastward = 0.01
v_northward = 0.01
temperature = 0.01
Uwind_eastward = 0.1       # m/s
Vwind_northward = 0.1

[attrs]
title = "NorKyst-800 (Norkyst_v3-800m): ROMS ocean forecast, surface layer"
